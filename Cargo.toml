[package]
name = "rust68"
version = "0.1.0"
edition = "2024"
description = "Émulateur de la série Motorola 68000 (68k) en Rust"
license = "GPL-3.0-or-later"

[dependencies]
# Optionnelle : uniquement pour le binaire de démonstration `atari_st_sdl2`
# (voir la feature `sdl2-frontend`). La bibliothèque et `cargo test` ne
# dépendent pas de SDL2.
sdl2 = { version = "0.38", optional = true, features = ["use-pkgconfig"] }

# Dépendances uniquement nécessaires aux tests (harness ProcessorTests/TomHarte).
# Elles ne sont pas embarquées dans la bibliothèque livrée.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Un sous-module par système émulé (voir `src/peripherals/`, `src/systems/`) :
# chacun derrière sa propre feature, aucune activée par défaut — le cœur
# 68000 seul est ce qu'on obtient sans rien demander explicitement.
# `cargo build --features atari-st` pour rapatrier/compiler l'Atari ST.
atari-st = []
sdl2-frontend = ["dep:sdl2", "atari-st"]
# Échafaudage NeXT (`src/systems/next/`) — pas encore un système fonctionnel,
# voir la doc du module.
next = []

[[bin]]
name = "atari_st_sdl2"
path = "src/bin/atari_st_sdl2.rs"
required-features = ["sdl2-frontend"]
