[package]
name = "rust68"
version = "0.1.0"
edition = "2024"
description = "Émulateur de la série Motorola 68000 (68k) en Rust"
license = "MIT OR Apache-2.0"

[dependencies]

# Dépendances uniquement nécessaires aux tests (harness ProcessorTests/TomHarte).
# Elles ne sont pas embarquées dans la bibliothèque livrée.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
